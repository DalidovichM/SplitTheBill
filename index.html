<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
 
</head>
<body>
    <div id="container">
        <h1>Let's Split Our Bill!!!</h1>
        <form>
        <span>
           <img src="https://img.icons8.com/?size=100&id=x9U4HcNp4Tv2&format=png&color=000000">
           <p>Bill</p>
            $ <input type="text" id="bill" placeholder="Bill">
            <p>Number of people</p>
        </span>
        <span>
            <input type="text" id="people" placeholder="How many people?">
       </span>
        <p>Did you like our cervice?</p>
        <button id="addTip">Add a tip!</button>
           
        <select id="tip" >
            <option disabled>Select an option</option> 
             <option value = "0.30">Wow! 30%</option>
             <option value = "0.20">Good cervice! 20%</option>
             <option value = "0.10">It was ok! 10%</option>
             <option value = "0.00"selected>No Tip!</option>
             </select>
        <button id="btn">Calculate</button>
    
<div id="showTotalAmountToPay">
    <div id="billSplit">
        <p>Bill</p>
        <span>$</span>
        <span id="dividedBill"></span>
        <span>per person</span>
    </div>
    <div id="totalTip">
        <p>Tip</p>
        <span>$</span>
        <span id="dividedTip"></span>
        <span>per person</span>
    </div>
    <div id="totalAmount">
        <p>Bill and Tip</p>
        <span>$</span>
        <span id="billAndTip"></span>
        <span>per person</span>
    </div>
</div>
</form>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="index.js"></script>
</body>
</html>
